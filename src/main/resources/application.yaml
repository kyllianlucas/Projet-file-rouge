spring:
  application:
    name: e-commerce

  datasource:
    url: jdbc:h2:file:./data/ecommerce   # Base persistante dans un fichier
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update   # Crée / met à jour automatiquement les tables
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console   # Console dispo sur http://localhost:8081/h2-console

  servlet:
    multipart:
      enabled: true         # Active l’upload multipart
      max-file-size: 10MB    # Taille max d’un fichier
      max-request-size: 10MB # Taille max d’une requête multipart

